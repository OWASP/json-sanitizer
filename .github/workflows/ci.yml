name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on JDK ${{ matrix.test-jdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [8, 11, 17, 21, 25]
    env:
      # The number of tests the suite executes: the legacy baseline's 28 (analysis/json-sanitizer/BASELINE.md)
      # plus the 20 added in Phase 2. A leg that runs fewer lost tests somewhere.
      MIN_TESTS: 48
      # A fixed seed so every leg and every run fuzzes the same 10,000 inputs. "json-san" in ASCII.
      FUZZ_SEED: 6a736f6e2d73616e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test JVM is set up first and the build JDK last: the last setup-java call owns JAVA_HOME and PATH.
      - name: Set up test JDK ${{ matrix.test-jdk }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.test-jdk }}

      - name: Set up build JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Locate the test JVM
        id: test-jvm
        run: |
          var="JAVA_HOME_${{ matrix.test-jdk }}_${{ runner.arch }}"
          java="${!var}/bin/java"
          "$java" -version
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - name: Build on JDK 21, run the tests on JDK ${{ matrix.test-jdk }}
        run: mvn -B -ntp clean verify -Djvm="${{ steps.test-jvm.outputs.java }}" -Dfuzz.seed="$FUZZ_SEED"

      - name: Check the tests ran on JDK ${{ matrix.test-jdk }} and at least the expected count executed
        run: |
          want='${{ matrix.test-jdk }}'
          if [ "$want" = 8 ]; then want=1.8; fi
          for f in target/surefire-reports/TEST-*.xml; do
            grep -q "name=\"java.specification.version\" value=\"$want\"" "$f" || { echo "$f did not run on Java $want"; exit 1; }
          done
          total=$(( $(grep -ho 'tests="[0-9]*"' target/surefire-reports/TEST-*.xml | grep -o '[0-9]*' | paste -sd+ -) ))
          echo "tests executed on Java $want: $total (expected at least $MIN_TESTS)"
          [ "$total" -ge "$MIN_TESTS" ]

      - name: Check the jar's bytecode level is Java 8 (class file major version 52)
        run: |
          jar=
          for f in target/*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) ;; *) jar="$f" ;; esac
          done
          rm -rf target/jar-check && mkdir -p target/jar-check
          unzip -q "$jar" 'com/*' -d target/jar-check
          majors=$(find target/jar-check -name '*.class' -exec "$JAVA_HOME/bin/javap" -v {} + | sed -n 's/^ *major version: //p' | sort -u)
          echo "$jar: class file major versions: $majors"
          [ "$majors" = "52" ]

      - name: Keep the test reports of a failed leg
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-jdk${{ matrix.test-jdk }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  fuzz:
    name: Fuzz with Jazzer for 5 minutes
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # JAZZER_FUZZ=1 turns the @FuzzTest from seed replay into fuzzing, for its maxDuration (5m).
      # Any exception or failed assertion is a finding and fails the job.
      - name: Fuzz JsonSanitizer.sanitize
        env:
          JAZZER_FUZZ: 1
        run: mvn -B -ntp test -Dtest='JsonSanitizerFuzzTest#sanitizeProperties' -Djacoco.skip=true

      # A finding is saved as a crash-* file next to the seed inputs; adding it there makes every
      # later test run replay it.
      - name: Keep the finding of a failed run
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jazzer-finding
          path: |
            src/test/resources/com/google/json/JsonSanitizerFuzzTestInputs/
            target/surefire-reports/
          if-no-files-found: ignore
