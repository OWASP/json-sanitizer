name: CI

# Pushes to master and pull requests. (Not every branch push: a branch with an open pull
# request would otherwise run everything twice.)
on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# An explicit bash makes every step run with `-eo pipefail`; the runner's default is `bash -e`,
# under which `mvn ... | tee fuzz.log` would take tee's exit status and hide a Jazzer finding.
defaults:
  run:
    shell: bash

jobs:
  test:
    name: Test on JDK ${{ matrix.test-jdk }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        test-jdk: [8, 11, 17, 21, 25]
    env:
      # The Jazzer seed inputs every leg replays: the empty input plus the files in
      # src/test/resources/com/google/json/JsonSanitizerFuzzTestInputs/sanitizeProperties/.
      MIN_SEED_REPLAYS: 8
      # A fixed seed so every leg and every run fuzzes the same 10,000 inputs. "json-san" in ASCII.
      FUZZ_SEED: 6a736f6e2d73616e
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The test JVM is set up first and the build JDK last: the last setup-java call owns JAVA_HOME and PATH.
      - name: Set up test JDK ${{ matrix.test-jdk }}
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: ${{ matrix.test-jdk }}

      - name: Set up build JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Locate the test JVM
        id: test-jvm
        run: |
          var="JAVA_HOME_${{ matrix.test-jdk }}_${{ runner.arch }}"
          java="${!var}/bin/java"
          "$java" -version
          echo "java=$java" >> "$GITHUB_OUTPUT"

      - name: Build on JDK 21, run the tests on JDK ${{ matrix.test-jdk }}
        run: mvn -B -ntp clean verify -Djvm="${{ steps.test-jvm.outputs.java }}" -Dfuzz.seed="$FUZZ_SEED"

      # Every report must come from the matrix JDK, and every test in .github/required-tests.txt
      # (the 28 legacy baseline tests, the golden corpus, the P0 rules ...) must have run, not skipped.
      - name: Check the required tests ran, unskipped, on JDK ${{ matrix.test-jdk }}
        run: |
          want='${{ matrix.test-jdk }}'
          if [ "$want" = 8 ]; then want=1.8; fi
          python3 .github/scripts/check_test_reports.py "$want" .github/required-tests.txt "$MIN_SEED_REPLAYS" target/surefire-reports

      - name: Check the jar's bytecode level is Java 8 (class file major version 52)
        run: |
          jar=
          for f in target/*.jar; do
            case "$f" in *-sources.jar|*-javadoc.jar) ;; *) jar="$f" ;; esac
          done
          rm -rf target/jar-check && mkdir -p target/jar-check
          unzip -q "$jar" 'com/*' -d target/jar-check
          majors=$(find target/jar-check -name '*.class' -exec "$JAVA_HOME/bin/javap" -v {} + | sed -n 's/^ *major version: //p' | sort -u)
          echo "$jar: class file major versions: $majors"
          [ "$majors" = "52" ]

      - name: Keep the test reports of a failed leg
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: surefire-reports-jdk${{ matrix.test-jdk }}
          path: target/surefire-reports/
          if-no-files-found: ignore

  fuzz:
    name: Fuzz with Jazzer
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # 2 minutes on a pull request for quick feedback, 5 on master. OSS-Fuzz fuzzes master
      # continuously as well (google/oss-fuzz projects/json-sanitizer).
      FUZZ_SECONDS: ${{ github.event_name == 'pull_request' && '120' || '300' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 21
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      # JAZZER_FUZZ=1 turns the @FuzzTest from seed replay into fuzzing; JAZZER_MAX_DURATION
      # overrides its maxDuration. Any exception or failed assertion is a finding and fails the job.
      - name: Fuzz JsonSanitizer and EvalMinifier
        env:
          JAZZER_FUZZ: 1
        run: JAZZER_MAX_DURATION="${FUZZ_SECONDS}s" mvn -B -ntp test -Dtest='JsonSanitizerFuzzTest#sanitizeProperties' -Djacoco.skip=true 2>&1 | tee fuzz.log

      # A green run proves nothing unless it fuzzed: Jazzer's summary line must show the full budget.
      - name: Check the fuzzer ran for its full time
        run: |
          line=$(grep -E '^Done [0-9]+ runs in [0-9]+ second' fuzz.log | tail -1)
          echo "${line:-no Jazzer summary line} (budget ${FUZZ_SECONDS} s)"
          secs=$(echo "$line" | sed -n 's/^Done [0-9]* runs in \([0-9]*\) second.*/\1/p')
          [ "${secs:-0}" -ge $(( FUZZ_SECONDS - 20 )) ]

      # A finding is saved as a crash-* file next to the seed inputs; adding it there makes every
      # later test run replay it. Also kept when the job times out.
      - name: Keep the finding of a failed run
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jazzer-finding
          path: |
            src/test/resources/com/google/json/JsonSanitizerFuzzTestInputs/
            crash-*
            .cifuzz-corpus/
            fuzz.log
            target/surefire-reports/
          include-hidden-files: true
          if-no-files-found: ignore

  # OSS-Fuzz builds master with `mvn package` on Ubuntu 20.04's Maven 3.6.3 and JDK 17
  # (google/oss-fuzz projects/json-sanitizer/build.sh). This job builds the same way, so a change
  # that would break continuous fuzzing fails here first.
  oss-fuzz-build:
    name: Build as OSS-Fuzz does (Maven 3.6.3, JDK 17)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      MAVEN_VERSION: 3.6.3
      MAVEN_SHA512: c35a1803a6e70a126e80b2b3ae33eed961f83ed74d18fcd16909b2d44d7dada3203f1ffe726c17ef8dcca2dcaa9fca676987befeadc9b9f759967a8cb77181c0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up JDK 17
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Install Maven 3.6.3 (checksum verified)
        run: |
          curl -fsSL -o "$RUNNER_TEMP/maven.tgz" "https://archive.apache.org/dist/maven/maven-3/$MAVEN_VERSION/binaries/apache-maven-$MAVEN_VERSION-bin.tar.gz"
          echo "$MAVEN_SHA512  $RUNNER_TEMP/maven.tgz" | sha512sum -c -
          tar xzf "$RUNNER_TEMP/maven.tgz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-$MAVEN_VERSION/bin" >> "$GITHUB_PATH"

      - name: Build as build.sh does
        run: |
          mvn -v
          version=$(mvn -B org.apache.maven.plugins:maven-help-plugin:3.2.0:evaluate -Dexpression=project.version -q -DforceStdout)
          mvn -B package -Dfuzz.seed=6a736f6e2d73616e
          ls -l "target/json-sanitizer-$version.jar"
          echo "PROJECT_JAR=target/json-sanitizer-$version.jar" >> "$GITHUB_ENV"

      # The rest of build.sh: copy gson, then compile every *Fuzzer.java that OSS-Fuzz keeps for this
      # project against the jar, so an API change that breaks OSS-Fuzz's own fuzzers fails here too.
      # Their current sources are fetched on purpose: the point is to track what OSS-Fuzz builds.
      # They are only compiled, never run, in a job that holds no secrets.
      - name: Compile OSS-Fuzz's fuzzers against the jar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out="$RUNNER_TEMP/oss-fuzz-out"
          mkdir -p "$out"
          mvn -B -q dependency:copy -Dartifact=com.google.code.gson:gson:2.8.6 -DoutputDirectory="$out"
          mvn -B -q dependency:build-classpath -DincludeArtifactIds=jazzer-api -Dmdep.outputFile="$out/jazzer-api.classpath"
          gh api repos/google/oss-fuzz/contents/projects/json-sanitizer \
            -q '.[] | select(.name | endswith("Fuzzer.java")) | .download_url' > "$out/fuzzers.txt"
          test -s "$out/fuzzers.txt"
          classpath="$PROJECT_JAR:$out/gson-2.8.6.jar:$(cat "$out/jazzer-api.classpath")"
          while read -r url; do
            curl -fsSL -o "$out/${url##*/}" "$url"
            javac -d "$out" -cp "$classpath" "$out/${url##*/}"
            echo "compiled ${url##*/}"
          done < "$out/fuzzers.txt"
